<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" rx="16" fill="#FFF8E1"/>
  
  <!-- Ground -->
  <rect x="0" y="160" width="320" height="40" rx="8" fill="#E8F5E9"/>
  
  <!-- Desk/table -->
  <rect x="40" y="100" width="240" height="60" rx="6" fill="#A1887F" stroke="#5D4037" stroke-width="3"/>
  <!-- Desk legs -->
  <rect x="45" y="140" width="10" height="25" rx="3" fill="#6D4C41"/>
  <rect x="265" y="140" width="10" height="25" rx="3" fill="#6D4C41"/>
  
  <!-- Pencil case on the RIGHT of desk -->
  <rect x="210" y="65" width="60" height="35" rx="8" fill="#FFB74D" stroke="#E65100" stroke-width="3"/>
  <!-- Pencil case detail - zipper -->
  <line x1="210" y1="82" x2="270" y2="82" stroke="#E65100" stroke-width="2"/>
  <circle cx="240" cy="82" r="4" fill="#E65100"/>
  <!-- Pencil peeking out -->
  <rect x="240" y="50" width="6" height="20" rx="3" fill="#FFF176" stroke="#F9A825" stroke-width="1"/>
  
  <!-- Arrow pointing right -->
  <line x1="160" y1="90" x2="215" y2="90" stroke="#E65100" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="215,85 228,90 215,95" fill="#E65100"/>
  
  <!-- "RIGHT" label on image -->
  <text x="240" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#5D4037">→ RIGHT</text>
  
  <!-- Bottom label -->
  <text x="160" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#E65100">on the right</text>
</svg>
