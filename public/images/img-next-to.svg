<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" rx="16" fill="#FFF8E1"/>
  
  <!-- Ground -->
  <rect x="0" y="160" width="320" height="40" rx="8" fill="#E8F5E9"/>
  
  <!-- Cat body -->
  <ellipse cx="100" cy="120" rx="28" ry="22" fill="#FF8A65" stroke="#BF360C" stroke-width="3"/>
  <!-- Cat head -->
  <circle cx="100" cy="88" r="20" fill="#FF8A65" stroke="#BF360C" stroke-width="3"/>
  <!-- Cat ears -->
  <polygon points="88,74 84,54 96,68" fill="#FF8A65" stroke="#BF360C" stroke-width="2"/>
  <polygon points="112,74 116,54 104,68" fill="#FF8A65" stroke="#BF360C" stroke-width="2"/>
  <!-- Cat eyes -->
  <circle cx="93" cy="85" r="4" fill="#333"/>
  <circle cx="107" cy="85" r="4" fill="#333"/>
  <!-- Cat tail -->
  <path d="M72,120 Q50,100 55,80" fill="none" stroke="#FF8A65" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Box next to cat -->
  <rect x="170" y="80" width="70" height="80" rx="8" fill="#90CAF9" stroke="#1565C0" stroke-width="3"/>
  <rect x="195" y="115" width="20" height="12" rx="4" fill="#1565C0"/>
  
  <!-- Label -->
</svg>
