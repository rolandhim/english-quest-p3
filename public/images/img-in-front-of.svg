<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" rx="16" fill="#FFF8E1"/>
  
  <!-- Ground -->
  <rect x="0" y="160" width="320" height="40" rx="8" fill="#E8F5E9"/>
  
  <!-- Wall -->
  <rect x="0" y="10" width="320" height="150" rx="4" fill="#E3F2FD"/>
  
  <!-- Whiteboard -->
  <rect x="70" y="40" width="180" height="100" rx="6" fill="#FFFFFF" stroke="#90A4AE" stroke-width="3"/>
  <text x="160" y="95" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Hello!</text>
  
  <!-- Board stand legs -->
  <line x1="70" y1="140" x2="60" y2="160" stroke="#90A4AE" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="140" x2="260" y2="160" stroke="#90A4AE" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Teacher figure (in front of board, facing board) -->
  <!-- Body -->
  <rect x="155" y="100" width="30" height="45" rx="6" fill="#42A5F5" stroke="#1565C0" stroke-width="2"/>
  <!-- Head -->
  <circle cx="170" cy="88" r="16" fill="#FFCC80" stroke="#BF360C" stroke-width="2"/>
  <!-- Pointer stick -->
  <line x1="210" y1="100" x2="175" y2="122" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Label -->
  <text x="160" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">in front of</text>
</svg>
