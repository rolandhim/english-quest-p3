<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" rx="16" fill="#FFF8E1"/>
  
  <!-- Ground -->
  <rect x="0" y="160" width="320" height="40" rx="8" fill="#E8F5E9"/>
  
  <!-- Box (in front) -->
  <rect x="160" y="60" width="100" height="100" rx="8" fill="#90CAF9" stroke="#1565C0" stroke-width="3"/>
  <rect x="200" y="98" width="20" height="14" rx="4" fill="#1565C0"/>
  <text x="210" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">BOX</text>
  
  <!-- Cat peeking from behind (partially visible behind box) -->
  <!-- Cat ears above box -->
  <polygon points="135,62 128,35 145,52" fill="#FF8A65" stroke="#BF360C" stroke-width="2"/>
  <polygon points="152,52 155,32 162,50" fill="#FF8A65" stroke="#BF360C" stroke-width="2"/>
  <!-- Cat eyes peeking above box -->
  <ellipse cx="140" cy="63" rx="5" ry="4" fill="#333"/>
  <ellipse cx="153" cy="59" rx="5" ry="4" fill="#333"/>
  <!-- Cat head top -->
  <path d="M130,65 Q140,55 158,55" fill="none" stroke="#FF8A65" stroke-width="6"/>
  <!-- Cat tail from left side -->
  <path d="M155,155 Q120,170 100,140" fill="none" stroke="#FF8A65" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Label -->
  <text x="160" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#BF360C">behind</text>
</svg>
