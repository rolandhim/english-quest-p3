<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" rx="16" fill="#FFF8E1"/>
  
  <!-- Ground -->
  <rect x="0" y="160" width="320" height="40" rx="8" fill="#E8F5E9"/>
  
  <!-- Left box -->
  <rect x="50" y="60" width="60" height="100" rx="8" fill="#90CAF9" stroke="#1565C0" stroke-width="3"/>
  <rect x="70" y="90" width="20" height="12" rx="4" fill="#1565C0"/>
  
  <!-- Ball between -->
  <circle cx="160" cy="130" r="25" fill="#FFB74D" stroke="#E65100" stroke-width="3"/>
  <line x1="148" y1="120" x2="155" y2="135" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
  <line x1="172" y1="120" x2="165" y2="135" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right box -->
  <rect x="210" y="60" width="60" height="100" rx="8" fill="#90CAF9" stroke="#1565C0" stroke-width="3"/>
  <rect x="230" y="90" width="20" height="12" rx="4" fill="#1565C0"/>
  
  <!-- Label -->
  <text x="160" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#E65100">between</text>
</svg>
